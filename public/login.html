<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nitrofree — login</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0b;color:#eee;font:15px ui-monospace,Menlo,Consolas,monospace}
  form{display:flex;flex-direction:column;gap:12px;width:280px}
  h1{font-size:22px;margin:0 0 8px;letter-spacing:-.5px}
  input,button{padding:11px;border:1px solid #333;background:#141414;color:#eee;font:inherit;border-radius:4px}
  button{background:#eee;color:#000;cursor:pointer;font-weight:700}
  #e{color:#f66;min-height:1em}
</style></head><body>
<form id="f"><h1>nitrofree</h1>
<input type="password" id="p" placeholder="password" autofocus>
<button>enter</button><div id="e"></div></form>
<script>
f.onsubmit=async e=>{e.preventDefault();
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});
  if(r.ok)location='/';else document.getElementById('e').textContent='wrong password';};
</script></body></html>
